<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamify | Music Web</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-brands fa-spotify"></i>
                <h2>Streamify</h2>
            </div>
            <nav>
                <ul>
                    <li class="active"><i class="fa-solid fa-house"></i> Home</li>
                    <li><i class="fa-solid fa-magnifying-glass"></i> Search</li>
                    <li><i class="fa-solid fa-record-vinyl"></i> Albums</li>
                    <li><i class="fa-solid fa-microphone"></i> Artists</li>
                    <li><i class="fa-solid fa-list-ul"></i> Playlists</li>
                </ul>
                <div class="divider"></div>
                <ul>
                    <li><i class="fa-solid fa-heart"></i> Liked Songs</li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="What do you want to listen to?">
                </div>
            </header>
            
            <div class="content-scroll">
                <section class="hero">
                    <h1 id="greeting">Good evening</h1>
                </section>
                
                <section class="music-section">
                    <h2 id="section-title">Trending Now</h2>
                    <div class="grid-container" id="songsGrid">
                        <!-- Skeleton Loaders will be injected here -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Bottom Player -->
    <footer class="player">
        <div class="player-left">
            <img id="playerArtwork" src="assets/default-art.png" alt="Artwork">
            <div class="player-info">
                <h4 id="playerTitle">No song selected</h4>
                <p id="playerArtist">-</p>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button id="btnShuffle" class="control-btn"><i class="fa-solid fa-shuffle"></i></button>
                <button id="btnPrev" class="control-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button id="btnPlayPause" class="play-btn"><i class="fa-solid fa-circle-play"></i></button>
                <button id="btnNext" class="control-btn"><i class="fa-solid fa-forward-step"></i></button>
                <button id="btnRepeat" class="control-btn"><i class="fa-solid fa-repeat"></i></button>
            </div>
            <div class="player-progress">
                <span id="timeCurrent">0:00</span>
                <input type="range" id="progressBar" value="0" min="0" max="100">
                <span id="timeTotal">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volumeBar" value="100" min="0" max="100">
        </div>
    </footer>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
